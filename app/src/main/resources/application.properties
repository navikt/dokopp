# Spring Boot
logging.config=classpath:logback-nais.xml
spring.jmx.enabled=false
spring.main.banner_mode=off
server.shutdown=graceful

camel.main.name=dokopp
camel.main.shutdown-timeout=30
camel.main.jmx-enabled=false
camel.mdc.enabled=true

# Actuator
management.endpoints.web.exposure.include=health, prometheus

# Circuitbreaker for Dokarkiv
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.record-exceptions=no.nav.dokopp.consumer.dokarkiv.DokarkivTechnicalException,\
  org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=no.nav.dokopp.consumer.dokarkiv.DokarkivFunctionalException
resilience4j.circuitbreaker.instances.dokarkivoppdaterjournalpost.base-config=default